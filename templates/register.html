<!DOCTYPE html>
<html>
<head>
    <title>Register - API Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #020617);
            color: white;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .register-container {
            height: 100vh;
        }

        .card {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 18px;
            box-shadow: 0 0 40px rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h3 {
            font-weight: 600;
            color: #e2e8f0;
        }

        input {
            background: #020617 !important;
            border: 1px solid #334155 !important;
            color: white !important;
            border-radius: 10px;
            padding: 12px;
            transition: 0.2s;
        }

        input:focus {
            border-color: #22c55e !important;
            box-shadow: 0 0 12px rgba(34,197,94,0.4);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .btn-custom {
            background: linear-gradient(135deg,rgb(77, 192, 237),rgb(44, 178, 231));
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 10px;
            padding: 12px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px skyblue;
        }

        a {
            color: #22d3ee;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .logo-title {
            font-size: 20px;
            font-weight: bold;
            color: #22d3ee;
        }

        .toggle-icon {
            color: #94a3b8;
        }

        .toggle-icon:hover {
            color: #22d3ee;
        }

        .form-control {
            margin-bottom: 10px;
        }
        p{
            color: #22d3ee;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center register-container">

    <div class="card p-4" style="width: 400px;">

        <h5 class="text-center logo-title mb-3">
            🚀 API Monitoring Platform
        </h5>

        <h3 class="text-center mb-4">Create Account</h3>

        <form method="POST">

            <!-- USERNAME -->
            <input type="text" name="username" class="form-control" placeholder="Username" required>

            <!-- PASSWORD -->
            <div class="position-relative">
                <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>

                <i class="bi bi-eye-slash position-absolute toggle-icon"
                   id="togglePassword"
                   style="top: 50%; right: 15px; transform: translateY(-50%); cursor: pointer;">
                </i>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="position-relative">
                <input type="password" 
                       id="confirmPassword" 
                       name="confirmPassword"
                       class="form-control" 
                       placeholder="Confirm Password" 
                       required>

                <i class="bi bi-eye-slash position-absolute toggle-icon"
                   id="toggleConfirmPassword"
                   style="top: 50%; right: 15px; transform: translateY(-50%); cursor: pointer;">
                </i>
            </div>

            <button class="btn btn-custom w-100 mt-3">Register</button>

        </form>

        <p class="text-center mt-3">
            Already have account?
            <a href="/login">Login</a>
        </p>

        {% with messages = get_flashed_messages() %}
            {% for msg in messages %}
                <p class="text-danger text-center">{{ msg }}</p>
            {% endfor %}
        {% endwith %}

    </div>

</div>

<script>
function togglePassword(toggleId, inputId) {
    const toggle = document.getElementById(toggleId);
    const input = document.getElementById(inputId);

    toggle.addEventListener("click", function () {
        const type = input.type === "password" ? "text" : "password";
        input.type = type;

        this.classList.toggle("bi-eye");
        this.classList.toggle("bi-eye-slash");
    });
}

togglePassword("togglePassword", "password");
togglePassword("toggleConfirmPassword", "confirmPassword");

// Frontend validation
document.querySelector("form").addEventListener("submit", function(e) {
    const pass = document.getElementById("password").value;
    const confirm = document.getElementById("confirmPassword").value;

    if (pass !== confirm) {
        alert("Passwords do not match!");
        e.preventDefault();
    }
});
</script>

</body>
</html>
