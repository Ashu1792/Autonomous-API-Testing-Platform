<!DOCTYPE html>
<html>
<head>
    <title>Register - API Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f172a, #020617);
            color: white;
            height: 100vh;
        }

        .register-container {
            height: 100vh;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(255,255,255,0.05);
        }

        h3 {
            font-weight: bold;
            color: grey;
        }

        input {
            background: #020617 !important;
            border: 1px solid #334155 !important;
            color: white !important;
            border-radius: 8px;
            padding: 10px;
        }

        input:focus {
            border-color: #22c55e !important;
            box-shadow: 0 0 10px rgba(34,197,94,0.3);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .btn-custom {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            padding: 10px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(34,197,94,0.5);
        }

        a {
            color: #22d3ee;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .logo-title {
            font-size: 20px;
            font-weight: bold;
            color: #22d3ee;
        }

        .toggle-icon {
            color: #94a3b8;
        }

        .toggle-icon:hover {
            color: #22d3ee;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center register-container">

    <div class="card p-4" style="width: 380px;">

        <h5 class="text-center logo-title mb-3">
            🚀 API Monitoring Platform
        </h5>

        <h3 class="text-center mb-4">Create Account</h3>

        <form method="POST">

            <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>

            <!-- PASSWORD -->
            <div class="position-relative mb-3">
                <input type="password" id="password" name="password" class="form-control" placeholder="Password" required>

                <i class="bi bi-eye-slash position-absolute toggle-icon"
                   id="togglePassword"
                   style="top: 50%; right: 15px; transform: translateY(-50%); cursor: pointer;">
                </i>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="position-relative mb-3">
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>

                <i class="bi bi-eye-slash position-absolute toggle-icon"
                   id="toggleConfirmPassword"
                   style="top: 50%; right: 15px; transform: translateY(-50%); cursor: pointer;">
                </i>
            </div>

            <button class="btn btn-custom w-100">Register</button>

        </form>

        <p class="text-center mt-3">
            Already have account?
            <a href="/login">Login</a>
        </p>

        {% with messages = get_flashed_messages() %}
            {% for msg in messages %}
                <p class="text-danger text-center">{{ msg }}</p>
            {% endfor %}
        {% endwith %}

    </div>

</div>

<!-- PASSWORD TOGGLE SCRIPT -->
<script>
function togglePassword(toggleId, inputId) {
    const toggle = document.getElementById(toggleId);
    const input = document.getElementById(inputId);

    toggle.addEventListener("click", function () {
        const type = input.type === "password" ? "text" : "password";
        input.type = type;

        this.classList.toggle("bi-eye");
        this.classList.toggle("bi-eye-slash");
    });
}

togglePassword("togglePassword", "password");
togglePassword("toggleConfirmPassword", "confirmPassword");
</script>

</body>
</html>
