<!DOCTYPE html>
<html lang="en">

<head>
    <title>API Monitoring Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg: #f0f9ff;
            --card: #ffffff;
            --primary: #0ea5e9;
            --accent: #16a34a;
            --danger: #ef4444;
            --text: #0f172a;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }

        .chart-container {
            height: 280px;
        }
    </style>
</head>

<body>

    <nav class="navbar bg-white shadow-sm px-4 mb-3">
        <span class="fw-bold">🚀 API Monitor</span>
        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </nav>

    <div class="container">

        <h2 class="text-center mb-4">Dashboard</h2>

        <!-- TABLE -->
        <div class="card mb-4">
            <h5>API Status</h5>
            <table class="table mt-3">
                <thead>
                    <tr>
                        <th>API</th>
                        <th>Status</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody>
                    {% for api in results %}
                    <tr>
                        <td>{{ api.api }}</td>
                        <td>
                            {% if api.status == 200 %}
                            <span class="badge bg-success">Healthy</span>
                            {% else %}
                            <span class="badge bg-danger">Failed</span>
                            {% endif %}
                        </td>
                        <td>{{ api.response_time }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>

        <!-- CHARTS -->
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <h5>Response Time</h5>
                    <div class="chart-container">
                        <canvas id="chart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <h5>Health</h5>
                    <div class="chart-container">
                        <canvas id="healthChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- EXTRA -->
        <div class="row mt-4">

            <div class="col-md-6">
                <div class="card">
                    <h5>Uptime</h5>
                    <table class="table">
                        <tbody id="uptimeTable"></tbody>
                    </table>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <h5>Failures</h5>
                    <table class="table">
                        <tbody id="failTable"></tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

    <script>
        const chart = new Chart(document.getElementById("chart"), {
            type: "line",
            data: { labels: [], datasets: [{ data: [] }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        const healthChart = new Chart(document.getElementById("healthChart"), {
            type: "doughnut",
            data: { labels: ["Healthy", "Failed"], datasets: [{ data: [0, 0] }] },
            options: { responsive: true, maintainAspectRatio: false }
        });

        function loadStats() {
            fetch("/api/stats")
                .then(r => r.json())
                .then(d => {
                    healthChart.data.datasets[0].data = [d.healthy, d.failed];
                    healthChart.update();
                });
        }

        function loadGraph() {
            fetch("/api/response-times")
                .then(r => r.json())
                .then(d => {
                    chart.data.labels = d.labels;
                    chart.data.datasets[0].data = d.values;
                    chart.update();
                });
        }

        function loadFailures() {
            fetch("/api/failures")
                .then(r => r.json())
                .then(d => {
                    let html = "";
                    d.forEach(f => {
                        html += `<tr><td>${f.url}</td><td>${f.time}</td></tr>`;
                    });
                    document.getElementById("failTable").innerHTML = html;
                });
        }

        function loadUptime() {
            fetch("/api/uptime-per-api")
                .then(r => r.json())
                .then(data => {
                    let html = "";
                    data.forEach(api => {
                        html += `<tr><td>${api.api}</td><td>${api.uptime}%</td></tr>`;
                    });
                    document.getElementById("uptimeTable").innerHTML = html;
                });
        }

        setInterval(() => {
            loadStats();
            loadGraph();
            loadFailures();
            loadUptime();
        }, 4000);

        loadStats();
        loadGraph();
        loadFailures();
        loadUptime();
    </script>

</body>

</html>
