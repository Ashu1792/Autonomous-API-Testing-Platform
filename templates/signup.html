<!DOCTYPE html>
<html>

<style>
    <title>Register - API Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

<style>
/* ---------- BODY ---------- */
body {
margin: 0;
height: 100vh;
font-family: 'Poppins', sans-serif;
background: radial-gradient(circle at top, #f0f9ff, #e0f2fe);
overflow: hidden;
}

/* Glow background */
body::before {
content: "";
position: absolute;
width: 600px;
height: 600px;
background: radial-gradient(circle, rgba(14,165,233,0.15), transparent);
top: -100px;
left: -100px;
filter: blur(100px);
}

body::after {
content: "";
position: absolute;
width: 500px;
height: 500px;
background: radial-gradient(circle, rgba(22,163,74,0.15), transparent);
bottom: -120px;
right: -120px;
filter: blur(100px);
}

/* ---------- CONTAINER ---------- */
.register-container {
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
}

/* ---------- CARD ---------- */
.card {
width: 420px;
padding: 30px;
border-radius: 20px;
background: rgba(255, 255, 255, 0.75);
backdrop-filter: blur(16px);
border: 1px solid #e2e8f0;
box-shadow: 0 10px 30px rgba(0,0,0,0.08);
transition: 0.3s;
}

.card:hover {
transform: translateY(-5px);
box-shadow: 0 15px 35px rgba(14,165,233,0.2);
}

/* ---------- HEADINGS ---------- */
.logo-title {
text-align: center;
font-weight: 600;
font-size: 22px;
color: #0ea5e9;
}

h3 {
text-align: center;
color: #0f172a;
margin-bottom: 20px;
}

/* ---------- INPUT GROUP ---------- */
.form-group {
position: relative;
margin-bottom: 20px;
}

.form-control {
width: 100%;
padding: 14px;
background: transparent;
border: 1px solid #cbd5e1;
border-radius: 10px;
color: #0f172a;
outline: none;
}

.form-control:focus {
border-color: #0ea5e9;
box-shadow: 0 0 8px rgba(14,165,233,0.2);
}

/* Floating label */
.form-label {
position: absolute;
top: 50%;
left: 12px;
transform: translateY(-50%);
color: #64748b;
font-size: 14px;
pointer-events: none;
transition: 0.3s;
}

.form-control:focus + .form-label,
.form-control:not(:placeholder-shown) + .form-label {
top: -8px;
left: 10px;
font-size: 12px;
color: #0ea5e9;
background: white;
padding: 0 5px;
}

/* ---------- BUTTON ---------- */
.btn-custom {
width: 100%;
padding: 12px;
border-radius: 10px;
border: none;
font-weight: 600;
background: linear-gradient(135deg, #0ea5e9, #38bdf8);
color: white;
transition: 0.3s;
}

.btn-custom:hover {
transform: scale(1.05);
box-shadow: 0 5px 20px rgba(14,165,233,0.4);
}

/* ---------- LINK ---------- */
a {
color: #0284c7;
text-decoration: none;
}

a:hover {
text-decoration: underline;
}

/* ---------- PASSWORD ICON ---------- */
.toggle-icon {
position: absolute;
top: 50%;
right: 15px;
transform: translateY(-50%);
cursor: pointer;
color: #64748b;
}

.toggle-icon:hover {
color: #0ea5e9;
}

/* ---------- FOOTER TEXT ---------- */
.footer-text {
text-align: center;
margin-top: 15px;
color: #64748b;
}

.error-msg {
text-align: center;
color: #ef4444;
margin-top: 10px;
}

/* ---------- ANIMATION ---------- */
.card {
animation: fadeIn 0.6s ease;
}

@keyframes fadeIn {
from {
opacity: 0;
transform: translateY(15px);
}
to {
opacity: 1;
transform: translateY(0);
}
}
</style>
</head>

<body>

    <div class="register-container">

        <div class="card">

            <div class="logo-title mb-2">🚀 API Monitoring</div>
            <h3>Create Account</h3>

            <form method="POST">

                <!-- USERNAME -->
                <div class="form-group">
                    <input type="text" name="username" class="form-control" placeholder=" " required>
                    <label class="form-label">Username</label>
                </div>

                <!-- PASSWORD -->
                <div class="form-group">
                    <input type="password" id="password" name="password" class="form-control" placeholder=" " required>
                    <label class="form-label">Password</label>
                    <i class="bi bi-eye-slash toggle-icon" id="togglePassword"></i>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="form-group">
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                        placeholder=" " required>
                    <label class="form-label">Confirm Password</label>
                    <i class="bi bi-eye-slash toggle-icon" id="toggleConfirmPassword"></i>
                </div>

                <button class="btn btn-custom mt-2">Register</button>

            </form>

            <div class="footer-text">
                Already have an account?
                <a href="/login">Login</a>
            </div>

            {% with messages = get_flashed_messages() %}
            {% for msg in messages %}
            <div class="error-msg">{{ msg }}</div>
            {% endfor %}
            {% endwith %}

        </div>

    </div>

    <script>
        function togglePassword(toggleId, inputId) {
            const toggle = document.getElementById(toggleId);
            const input = document.getElementById(inputId);

            toggle.addEventListener("click", function () {
                const type = input.type === "password" ? "text" : "password";
                input.type = type;

                this.classList.toggle("bi-eye");
                this.classList.toggle("bi-eye-slash");
            });
        }

        togglePassword("togglePassword", "password");
        togglePassword("toggleConfirmPassword", "confirmPassword");

        /* Password match validation */
        document.querySelector("form").addEventListener("submit", function (e) {
            const pass = document.getElementById("password").value;
            const confirm = document.getElementById("confirmPassword").value;

            if (pass !== confirm) {
                alert("Passwords do not match!");
                e.preventDefault();
            }
        });
    </script>

</body>

</html>
