<!DOCTYPE html>
<html>
<head>
    <title>Login - API Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        #togglePassword:hover {
    color: #22d3ee;
}

        body {
            background: #0f172a;
            color: white;
        }

        .card {
            background: #1e293b;
            border: none;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        input {
            background: #0f172a !important;
            border: 1px solid #334155 !important;
            color: white !important;
        }

        input::placeholder {
            color: #94a3b8;
        }

        .btn-custom {
            background: #22d3ee;
            border: none;
            color: black;
            font-weight: bold;
        }

        .btn-custom:hover {
            background: #06b6d4;
        }

        a {
            color: #22d3ee;
            text-decoration: none;
        }

        h3{
            color: white;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card p-4" style="width: 350px;">

        <h3 class="text-center mb-3">🔐 Login</h3>

        <form method="POST">

            <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>

            <div class="position-relative mb-3">
    <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
    
    <i class="bi bi-eye-slash position-absolute"
       id="toggleConfirmPassword"
       style="top: 50%; right: 15px; transform: translateY(-50%); cursor: pointer;">
    </i>
</div>
            <button class="btn btn-custom w-100">Login</button>

        </form>

        <p class="text-center mt-3">
            Don't have account?
            <a href="/register">Register</a>
        </p>

        {% with messages = get_flashed_messages() %}
            {% for msg in messages %}
                <p class="text-danger text-center">{{ msg }}</p>
            {% endfor %}
        {% endwith %}

    </div>

</div>

<script>
function togglePassword(toggleId, inputId) {
    const toggle = document.getElementById(toggleId);
    const input = document.getElementById(inputId);

    toggle.addEventListener("click", function () {
        const type = input.type === "password" ? "text" : "password";
        input.type = type;

        this.classList.toggle("bi-eye");
        this.classList.toggle("bi-eye-slash");
    });
}

togglePassword("togglePassword", "password");
togglePassword("toggleConfirmPassword", "confirmPassword");
</script>

</body>
</html>
